<div class="p-8 h-full overflow-y-auto bg-white custom-scrollbar page-enter w-full flex items-center justify-center">

  <div class="bg-[#F8F8F8] border border-gray-200 rounded-3xl p-10 shadow-sm w-full max-w-lg text-center card-hover animate-scale-in">

    <!-- Animated upload icon -->
    <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm border border-gray-100 group-hover:shadow-md transition-shadow">
      <svg class="w-9 h-9 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
    </div>

    <h2 class="text-xl font-semibold text-gray-800 mb-2">Offline Excel Sync</h2>
    <p class="text-sm text-gray-400 mb-8 leading-relaxed">Upload your Excel log spreadsheet (.xlsx) to sync offline sales records back into the database. Entries will be tagged as <span class="font-medium text-gray-600">Excel Log</span>.</p>

    <!-- Drop Zone -->
    <label for="excel-upload"
      class="block border-2 border-dashed border-gray-200 rounded-2xl p-10 bg-white mb-6 hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 cursor-pointer group">
      <input id="excel-upload" type="file" accept=".xlsx,.xls" class="hidden">
      <div class="flex flex-col items-center text-gray-400 group-hover:text-gray-600 transition-colors">
        <svg class="w-10 h-10 mb-3 group-hover:scale-110 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <p class="text-sm font-medium text-gray-600">Click to upload or drag & drop</p>
        <p class="text-xs text-gray-400 mt-1">Supports .xlsx and .xls — max 10 MB</p>
      </div>
    </label>

    <button class="w-full bg-gray-800 text-white rounded-full py-3.5 font-semibold shadow-md hover:bg-black hover:shadow-lg transition-all duration-200 btn-press">
      Sync Sales Log
    </button>
  </div>
</div>
