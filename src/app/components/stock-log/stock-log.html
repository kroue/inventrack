<div class="p-8 h-full w-full overflow-y-auto bg-white custom-scrollbar page-enter">

  <div class="bg-[#F8F8F8] border border-gray-200 rounded-3xl p-8 shadow-sm card-hover animate-fade-in-up w-full min-h-[500px]">

    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-semibold text-gray-800">Stock Log</h2>
      <div class="flex space-x-2">
        <span class="bg-blue-100 text-blue-700 text-[11px] font-semibold px-3 py-1 rounded-full">IN: 200</span>
        <span class="bg-red-100 text-red-700 text-[11px] font-semibold px-3 py-1 rounded-full">OUT: 5</span>
      </div>
    </div>

    <!-- Table Header -->
    <div class="grid grid-cols-5 text-xs font-semibold text-gray-400 uppercase tracking-widest pb-4 px-4 border-b border-gray-200">
      <div class="col-span-1">Product</div>
      <div class="col-span-1 text-center">Quantity</div>
      <div class="col-span-1 text-center">Change Type</div>
      <div class="col-span-1 text-center">Date</div>
      <div class="col-span-1 pl-4">Remarks</div>
    </div>

    <!-- Table Body -->
    @for (log of stockLogs; track log.product; let i = $index) {
      <div class="grid grid-cols-5 items-center py-4 px-4 border-b border-gray-100 text-sm text-gray-700 table-row-hover rounded-xl animate-fade-in-up"
           [ngStyle]="{'animation-delay': (i * 60) + 'ms'}">
        <div class="col-span-1 font-medium text-gray-800">{{ log.product }}</div>
        <div class="col-span-1 text-center font-semibold tabular-nums">{{ log.quantity }}</div>
        <div class="col-span-1 text-center">
          <span class="inline-block px-3 py-0.5 rounded-full text-[11px] font-bold"
            [ngClass]="{
              'bg-green-100 text-green-700': log.type === 'IN',
              'bg-red-100 text-red-600': log.type === 'OUT',
              'bg-yellow-100 text-yellow-700': log.type === 'ADJUST'
            }">
            {{ log.type }}
          </span>
        </div>
        <div class="col-span-1 text-center text-gray-400 text-xs">{{ log.date || '—' }}</div>
        <div class="col-span-1 pl-4 text-gray-400 text-xs italic">{{ log.remarks || '—' }}</div>
      </div>
    }
  </div>
</div>
